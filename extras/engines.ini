# extras/engines.ini — where update.py installs each serving engine.
#
# This deployment keeps every engine in ONE directory: /opt/llama/tools, the
# `tools/` subdirectory of the run directory that holds config.yaml. Each
# engine is a versioned entry with a stable symlink beside it:
#
#   tools/llama-swap       -> llama-swap-v265
#   tools/llama-server     -> ./llama-b11714/llama-server
#   tools/audiocpp_server  -> audiocpp_server-v0.9.2
#   tools/whisper-server   -> ./whisper-server-b1.9.2/bin/whisper-server
#   tools/sd-server        -> ./sd-server-827/sd-server
#
# Without these entries, update.py would update each engine where it finds it —
# which, before this deployment was converged, meant three different trees.
# `./extras/update.py --print-paths all` shows what it resolved and why.
#
# Paths also belong in profiles.yaml (`audio_cpp.bin`, `whisper.bin`, …) or in
# $AUDIOCPP_BIN_DIR & friends; llama-packer reads the same names from either.

[engines]
root = /opt/llama/tools
cpp = /opt/llama/tools
swap = /opt/llama/tools
audio = /opt/llama/tools
whisper = /opt/llama/tools
sd = /opt/llama/tools