# ── Command templates ──────────────────────────────────
templates:
  llama-server:
    cmd: |
      {{llama_bin}} --port ${PORT}
      --cont-batching --flash-attn on --no-mmap --no-context-shift
      --model {{model_path}}
      --ctx-size {{ctx_size}}
      --parallel {{parallel}}
      --cache-type-k {{cache_type}} --cache-type-v {{cache_type}}
      {{extra_args}}

# ── Global defaults ────────────────────────────────────
defaults:
  cache_type: q8_0
  parallel: 1
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.01
  pres_pen: 0.0

# ── Profile definitions ────────────────────────────────
profiles:
  default:

  coder:
    description: "Optimized for code generation and bash commands"
    temperature: "base * 0.7"

  creative:
    description: "Higher temperature for creative and writing tasks"
    temperature: "base * 1.2"

#  server:
#    description: "concurrency"
#    parallel: 2

# ── vLLM docker backend ────────────────────────────────
# Defaults for models opted into the `template: vllm-docker` backend.
# Image can also be overridden per run via `gen-config.py --vllm-image`.
vllm:
  image: vllm/vllm-openai:latest
  docker_args: "--runtime=nvidia --gpus all --shm-size=16g"
  container_port: 8000
  gpu_mem_util: 0.9
