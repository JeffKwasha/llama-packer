# ── Global defaults ────────────────────────────────────
defaults:
  cache_type: q8_0
  parallel: 1
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.01
  pres_pen: 0.0

# ── Profile definitions ────────────────────────────────
profiles:
  default:

  coder:
    description: "Optimized for code generation and bash commands"
    temperature: "base * 0.7"

  creative:
    description: "Higher temperature for creative and writing tasks"
    temperature: "base * 1.2"

#  server:
#    description: "concurrency"
#    parallel: 2

# ── vLLM backend ───────────────────────────────────────
# Defaults for models opted into the `template: vllm` / `template: vllm-docker`
# backend. The image can be overridden per run via `llama-packer --vllm-image`,
# the binary via `--vllm-server`.
vllm:
  image: vllm/vllm-openai:latest
  bin: vllm
  docker_args: "--runtime=nvidia --gpus all --shm-size=16g"
  container_port: 8000
  # gpu_mem_util: 0.9   # optional; when omitted it is derived from the same
                        # reserve/spare VRAM budget llama.cpp uses

# ── Hardware ───────────────────────────────────────────
# VRAM detection lives in llama_packer/hardware.py. Optional overrides:
#   hardware:
#     vram: 120G                 # full override of the detected VRAM pool
#     unified_system_mb: 8192    # system reservation on unified-memory hosts
#                                # (GB10/DGX Spark, Apple Silicon): the VRAM
#                                # budget is total RAM minus this. Default 8192
#                                # (8 GiB); override per-host for unusually
#                                # light/heavy system use. CLI: --unified-system-mb
