# ── Global defaults ────────────────────────────────────
defaults:
  cache_type: q8_0
  parallel: 1
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.01
  pres_pen: 0.0

# ── Profile definitions ────────────────────────────────
profiles:
  default:

  coder:
    description: "Optimized for code generation and bash commands"
    temperature: "base * 0.7"

  creative:
    description: "Higher temperature for creative and writing tasks"
    temperature: "base * 1.2"

#  server:
#    description: "concurrency"
#    parallel: 2

# ── vLLM backend ───────────────────────────────────────
# Defaults for models whose override rules select the `vllm` / `vllm-docker`
# backend. The image can be overridden per run via `llama-packer --vllm-image`,
# the binary via `--vllm-server`. Per-model recipe keys (sidecar or override
# rule): vllm_quantization (--quantization; NOT the metadata `quantization`),
# moe_backend (--moe-backend), tool_call_parser (--enable-auto-tool-choice
# --tool-call-parser), reasoning_parser (--reasoning-parser; distinct from
# llama.cpp's reasoning-format), and mamba: (hybrid models — backend,
# ssm_cache_dtype, stochastic_rounding, philox_rounds, cache_mode).
vllm:
  image: vllm/vllm-openai:latest
  bin: vllm
  docker_args: "--runtime=nvidia --gpus all --shm-size=16g"
  container_port: 8000
  # gpu_mem_util: 0.9   # optional; when omitted it is derived from the same
  #                       reserve/spare VRAM budget llama.cpp uses
  # hf_cache: /nas/humaii/config/models/.hf   # host HF_HOME root (the dir
  #                       # containing hub/) bind-mounted into vllm-docker
  #                       # containers at /root/.cache/huggingface (falls back
  #                       # to top-level hf_home:).  Docker entries run with
  #                       # HF_HUB_OFFLINE=1 — models must be pre-staged here;
  #                       # nothing downloads.

# ── whisper-server backend (optional, speech-to-text) ──
# Opt-in via profiles.yaml `dirs: {s2t: s2t}`; each model needs an authored
# same-stem sidecar beside its GGML .bin. CLI --whisper-server overrides.
# whisper:
#   bin: whisper-server

# ── Hardware ───────────────────────────────────────────
# VRAM detection lives in llama_packer/hardware.py. Optional overrides:
#   hardware:
#     vram: 120G                 # full override of the detected VRAM pool
#     unified_system_mb: 8192    # system reservation on unified-memory hosts
#                                # (GB10/DGX Spark, Apple Silicon): the VRAM
#                                # budget is total RAM minus this. Default 8192
#                                # (8 GiB); override per-host for unusually
#                                # light/heavy system use. CLI: --unified-system-mb

# ── Override rules (pattern-scoped serving choices) ────
# Match models by sidecar fields and set backend / hf_repo / chat_template /
# chat_template_kwargs / loras / cli_args / reasoning-format /
# reasoning-preserve. `when` is required; use `when: true` to match all.
# One merge rule everywhere (SPEC.md "Layer merge rule"): dicts merge per
# key, lists union-append (`-item` removes), None deletes a key outright.
# See SPEC.md "Override Rules" + "Reasoning".
#
# overrides:
#   - when: {base_model: 'qwen3\.[68]'}
#     chat_template: qwen_chat_template.jinja
#     reasoning-format: deepseek
#     reasoning-preserve: true
#   # - when: {base_model: 'qwen3'}
#   #   loras: [shared-uncensored.gguf]  # appended to each model's loras
#   # - when: {name: 'tiny-.*'}
#   #   cache_type: None                 # delete: fall back to built-in q8_0

# Usage categories a model can declare with `usage:` in its sidecar. Only
# declared categories count -- an undeclared tag warns and is ignored, which
# is what keeps the vocabulary honest.
#
#   min_context   the window the category needs to be useful; a model that
#                 cannot serve it at any rung is dropped from the set
#   min_parallel  slots the category wants, as a preference: the context
#                 floor wins, since the id advertises the context
#   require       capabilities this category will not give up
#   sacrifice     preference order for what to shed first, not a cost order
tasks:
  # Chat-endpoint tasks: one serving covers all of them; they evict each
  # other by request. endpoint + role are required; the demand keys are the
  # floors the planner must meet.
  chat:
    endpoint: openai.chat.completions
    role: chat
    min_context: 64k
    min_parallel: 2
    sacrifice: [draft, vision]
  coding:
    endpoint: openai.chat.completions
    role: chat
    min_context: 130k
    min_parallel: 1
    sacrifice: [vision]
    keep: [draft]
  qa:
    endpoint: openai.chat.completions
    role: chat
    min_context: 32k
    min_parallel: 2
  aux:
    endpoint: openai.chat.completions
    role: chat
    min_context: 80k
    min_parallel: 2
    sacrifice: [draft]
  # Capability tasks: endpoint and role only; they are sized by their role.
  embeddings:
    endpoint: openai.embeddings
    role: embeddings
  rerank:
    endpoint: openai.rerank
    role: rerank
  image:
    endpoint: openai.images.generations
    role: image
  s2t:
    endpoint: openai.audio.transcriptions
    role: s2t
  t2s:
    endpoint: openai.audio.speech
    role: t2s

