[project]
name = "llama-packer"
version = "0.1.0"
description = "Generate llama-swap config from model metadata"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]

[project.scripts]
gen-config = "llama_packer.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llama_packer*"]

[tool.setuptools.package-data]
llama_packer = ["profiles.yaml"]
