[project]
name = "llama-packer"
dynamic = ["version"]
description = "Generate llama-swap config from model metadata"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "ruamel-yaml>=0.19.1",
]

[project.optional-dependencies]
# Recommended (not required) for vLLM-backend memory sizing. Without it,
# vLLM-served models fall back to a local safetensors-header estimate.
vllm = ["vllm-memory-estimator"]

[project.scripts]
llama-packer = "llama_packer.__main__:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llama_packer*"]

[tool.setuptools.package-data]
llama_packer = ["profiles.yaml", "templates/*.md"]

[tool.setuptools.dynamic]
version = {attr = "llama_packer.__version__"}

[tool.uv.sources]
vllm-memory-estimator = { git = "https://github.com/ashishkamra/vllm-memory-estimator.git" }
