# ── Global defaults ────────────────────────────────────
defaults:
  cache_type: q8_0
  parallel: 1
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.01
  pres_pen: 0.0

# Model roots (CLI --models-dir overrides this). Role is selected by the
# first-level subdirectory: chat/ t2t/ vision/ doc/ → chat, embed/ →
# embeddings, rerank/ → rerank; other subdirs (img/, misc/, tmp/…) are
# ignored, and files at a root are chat.
models_dirs:
  - /mnt/ai/models
  - ./models

# HF cache root: sidecars with `hf_repo:` + `model:` resolve hub snapshots
# directly from here (no symlinks into the models dirs needed).
hf_home: /mnt/ai/huggingface

overrides:
  - when: {base_model: 'qwen3\.?[568]'}
    chat_template: qwen_chat_template.jinja
    chat_template_kwargs: {enable_thinking: true}

# ── Profile definitions ────────────────────────────────
profiles:
  default:

  coder:
    description: "Optimized for code generation and bash commands"
    temperature: "base * 0.7"

  creative:
    description: "Higher temperature for creative and writing tasks"
    temperature: "base * 1.2"

#  server:
#    description: "concurrency"
#    parallel: 2

# ── Swap matrix ─────────────────────────────────────────
# Enables the llama-swap matrix router: every chat model shares a set with the
# CPU-resident embed (emb) and rerank (rnk) models, so RAG models stay loaded
# alongside whatever chat model is active. __CHAT_VARS__ is expanded to the
# generated (c1 | c2 | ...) var expression at build time.
matrix:
  evict_costs:
    emb: 100
    rnk: 100
  sets:
    rag: "__CHAT_VARS__ & emb & rnk"

