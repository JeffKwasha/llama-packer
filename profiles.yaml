# ── Command templates ──────────────────────────────────
templates:
  llama-server:
    cmd: |
      {{llama_bin}} --port ${PORT}
      --cont-batching --flash-attn on --no-mmap --no-context-shift
      --model {{model_path}}
      --ctx-size {{ctx_size}}
      --parallel {{parallel}}
      --cache-type-k {{cache_type}} --cache-type-v {{cache_type}}
      {{extra_args}}

  vllm-docker:
    cmd: |
      docker run --init --rm --gpus all --name ${MODEL_ID}
        -v {{models_dir}}:/models
        vllm/vllm-openai:v0.10.0
        --model {{model_path}}
        --served-model-name ${MODEL_ID}
        --max-model-len {{context_length}}
        --gpu-memory-utilization 0.9
        --enforce-eager

# ── Global defaults ────────────────────────────────────
defaults:
  cache_type: q8_0
  parallel: 1
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.01
  pres_pen: 0.0

# ── Profile definitions ────────────────────────────────
profiles:
  default:

  coder:
    description: "Optimized for code generation and bash commands"
    temperature: "base * 0.7"

  creative:
    description: "Higher temperature for creative and writing tasks"
    temperature: "base * 1.2"

#  server:
#    description: "concurrency"
#    parallel: 2

# ── Swap matrix ─────────────────────────────────────────
# Enables the llama-swap matrix router: every chat model shares a set with the
# CPU-resident embed (emb) and rerank (rnk) models, so RAG models stay loaded
# alongside whatever chat model is active. __CHAT_VARS__ is expanded to the
# generated (c1 | c2 | ...) var expression at build time.
matrix:
  evict_costs:
    emb: 100
    rnk: 100
  sets:
    rag: "__CHAT_VARS__ & emb & rnk"

